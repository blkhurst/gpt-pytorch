[project]
name = "gpt-pytorch"
version = "0.1.0"
description = "A GPT implementation built with PyTorch."
readme = "README.md"
authors = [
    { name = "Blkhurst", email = "github@blkhurst.co.uk" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
]

[project.scripts]
gpt-pytorch = "gpt_pytorch:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["gpt_pytorch", "chess_gpt"]
